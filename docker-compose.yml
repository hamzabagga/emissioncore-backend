services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: emission
      POSTGRES_PASSWORD: emission
      POSTGRES_DB: emission
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emission"]
      interval: 3s
      retries: 10

  api:
    build: .
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - .:/code
    environment:
      DATABASE_URL: postgresql+psycopg://emission:emission@db:5432/emission
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
  worker:
    build: .
    command: python -m app.worker
    volumes:
      - .:/code
    environment:
      DATABASE_URL: postgresql+psycopg://emission:emission@db:5432/emission
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started
